# Optional local pre-commit hooks for maintainers. NOT wired into CI.
# Install once:
#   pip install pre-commit
#   pre-commit install
# The hooks mirror the .editorconfig rules and guard against accidental
# large/binary commits (the historical competition corpus stays local-only).

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=5120"]
